<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRES Task Dashboard</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f2937">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CRES Tasks">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="config.js"></script>
<style>
  :root{
    --brand:#14565b; --bg:#f4f6f8; --card:#fff; --ink:#1f2933; --muted:#6b7280; --line:#e5e7eb;
    --late:#c0392b; --lateBg:#fdecea; --ok:#1e8449; --okBg:#e7f6ec; --due:#9a6700; --dueBg:#fff4d6;
    --up:#475569; --upBg:#eef2f6; --chip:#eef4f4;
    --L2O:#6b4fa0; --O2D:#0f766e; --PE:#b45309;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  header{background:var(--brand);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:6}
  header .brand{font-weight:700;font-size:16px}
  header .who{opacity:.92;font-size:13px}
  header .sync{opacity:.75;font-size:12px}
  header .sp{flex:1}
  header select{padding:6px 8px;border-radius:6px;border:0;font-size:13px;max-width:240px}
  .testtag{background:#e4572e;color:#fff;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600}
  .iconbtn{background:rgba(255,255,255,.15);border:0;color:#fff;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:13px;position:relative}
  .iconbtn:hover{background:rgba(255,255,255,.28)}
  .badge{position:absolute;top:-6px;right:-6px;background:#e4572e;color:#fff;border-radius:10px;font-size:10px;padding:1px 6px;font-weight:700}
  .wrap{max-width:1500px;margin:0 auto;padding:16px}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .tab{padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600;color:var(--muted)}
  .tab.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .btn{padding:8px 14px;border-radius:6px;border:1px solid var(--brand);background:var(--brand);color:#fff;cursor:pointer;font-weight:600;font-size:13px}
  .btn.ghost{background:#fff;color:var(--brand)} .btn.sm{padding:4px 10px;font-size:12px}
  .btn.red{background:var(--late);border-color:var(--late)} .btn:disabled{opacity:.5;cursor:default}
  .errors{background:var(--lateBg);color:var(--late);border:1px solid #f5c6c0;border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:13px}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .card .n{font-size:22px;font-weight:700} .card .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .card.late .n{color:var(--late)} .card.ok .n{color:var(--ok)}
  .card.go{cursor:pointer} .card.go:hover{border-color:var(--brand)}
  .subtabs{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-right:6px}
  .subtabs button{border:0;background:#fff;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit}
  .subtabs button.on{background:var(--brand);color:#fff}
  .evlink{color:var(--brand);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
  table.lu .lu-text{min-width:260px;white-space:pre-wrap} table.lu tr.lu-done .lu-text{color:var(--muted)}
  .srn{width:34px;color:var(--muted);font-weight:600;text-align:center}
  .estat{padding:3px 6px;border:1px solid var(--line);border-radius:6px;font-size:12px;background:#fff}
  .panels{display:grid;grid-template-columns:var(--cols,1.15fr 1fr 1.15fr);gap:12px;align-items:start}
  .panels > .panel{min-width:0}
  .panel{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .panel h4{margin:0;padding:10px 12px;font-size:13px;color:#fff;display:flex;justify-content:space-between;align-items:center}
  .panel h4 small{font-weight:400;opacity:.85}
  .panel .scroll{height:226px;overflow:auto}          /* every dashboard table has the same fixed size; empty space stays empty */
  .panel table{min-width:560px}
  .panel td,.panel th{white-space:nowrap}
  .panel thead th{position:sticky;top:0;z-index:1}
  .panel td{height:48px}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .filters select,.filters input{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:13px}
  .tablewrap{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:auto}
  table{width:100%;border-collapse:collapse}
  th{background:#f9fafb;text-align:left;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:0}
  tr.click{cursor:pointer} tr.click:hover td{background:#f7fafa}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--muted);white-space:nowrap}
  .small{font-size:12px;color:var(--muted)}
  .late{color:var(--late);font-weight:700} .ok{color:var(--ok);font-weight:600} .muted{color:var(--muted)}
  .pill{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:600;background:var(--chip);white-space:nowrap}
  .tag{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;margin-left:4px;vertical-align:middle}
  .tag.new{background:#f59e0b;color:#fff} .tag.new.stale{background:var(--late)} .tag.pe{background:#fdf0e1;color:var(--PE)}
  .tag.al{background:#e8f1fb;color:#1d5fa8}
  .col{display:flex;flex-direction:column;gap:12px;min-width:0}
  .typesel{display:flex;gap:8px;margin-bottom:6px}
  .typesel button{flex:1;padding:10px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:600;cursor:pointer;color:var(--muted)}
  .typesel button.on{border-color:var(--brand);background:#eef6f6;color:var(--brand)}
  select.st{padding:4px 6px;border-radius:12px;border:1px solid var(--line);font-weight:600;font-size:12px}
  .s-pending{background:#fff7e6;color:#9a6700} .s-inprogress{background:#e8f1fb;color:#1d5fa8}
  .s-onhold{background:#f1ecfa;color:#6b4fa0} .s-done{background:var(--okBg);color:var(--ok)} .s-cancelled{background:#f3f4f6;color:#6b7280}
  /* tracker grid */
  .grid{border-collapse:separate;border-spacing:0;font-size:12px}
  .grid th,.grid td{border-bottom:1px solid var(--line);border-right:1px solid #f0f2f4;padding:5px 6px;text-align:center}
  .grid thead th{position:sticky;background:#f9fafb;z-index:2}
  .grid thead tr:first-child th{top:0;color:#fff;font-size:11px;letter-spacing:.4px}
  .grid thead tr:nth-child(2) th{top:27px;text-transform:none;font-size:11px;white-space:normal;min-width:84px;max-width:100px;line-height:1.25;vertical-align:bottom;color:#374151}
  .grid .sr{position:sticky;left:0;background:#fff;z-index:1;width:38px;min-width:38px;max-width:38px;color:var(--muted);font-weight:600}
  .grid thead .sr{z-index:3;background:#f9fafb;color:#374151 !important;vertical-align:bottom;font-size:11px}
  .grid tbody tr:hover td.sr{background:#f2f7f7}
  .grid .ev{position:sticky;left:38px;background:#fff;z-index:1;text-align:left;min-width:220px;max-width:240px;border-right:2px solid var(--line)}
  .grid thead .ev{z-index:3;background:#f9fafb;color:#374151 !important;vertical-align:bottom;font-size:12px}
  .grid tbody tr:hover td{background:#fafcfc} .grid tbody tr:hover td.ev{background:#f2f7f7}
  .c{display:inline-block;min-width:66px;padding:2px 4px;border-radius:5px;font-weight:600;white-space:nowrap}
  .c.done{background:var(--okBg);color:var(--ok)} .c.mk{background:#e8f1fb;color:#1d5fa8;border:1px dashed #1d5fa8} .c.no{background:#f3f4f6;color:#6b7280}
  .c.late{background:var(--lateBg);color:var(--late)} .c.due{background:var(--dueBg);color:var(--due)} .c.up{background:var(--upBg);color:var(--up)}
  .legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:8px;align-items:center}
  .scope{display:inline-flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#fff}
  .scope button{border:0;background:#fff;padding:8px 14px;font-weight:600;color:var(--muted);cursor:pointer}
  .scope button.on{background:var(--brand);color:#fff}
  .chipf{cursor:pointer;border:2px solid transparent} .chipf:hover{filter:brightness(.95)}
  .chipf.sel{border-color:var(--ink)} .c.all{background:#fff;color:var(--ink);border:1px solid var(--line)} .c.all.sel{border:2px solid var(--ink)}
  /* mobile preview (desktop toggle) */
  body.mobile{background:#d9dee3}
  body.mobile #app{max-width:390px;margin:0 auto;background:var(--bg);min-height:100vh;box-shadow:0 0 0 1px #c5ccd3,0 10px 40px rgba(0,0,0,.15)}
  #viewbtn{display:inline-block}
  .empty{padding:24px;text-align:center;color:var(--muted)}
  .modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
  .modal.hidden{display:none}
  .box{background:#fff;border-radius:12px;max-width:520px;width:100%;padding:18px 20px;max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
  .box.wide{max-width:900px}
  .box h3{margin:0 0 10px;color:var(--brand)}
  .box label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 4px}
  .box input,.box select,.box textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;font-size:14px;font-family:inherit}
  .box textarea{min-height:70px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
  .kv{display:grid;grid-template-columns:130px 1fr;gap:4px 12px;font-size:13px;margin-bottom:10px}
  .kv b{color:var(--muted);font-weight:600}
  .brief{white-space:pre-wrap;background:#fafbfc;border:1px solid var(--line);border-radius:6px;padding:8px;max-height:200px;overflow:auto;font-size:13px}
  .stagehead{margin:14px 0 6px;font-weight:700;font-size:13px}
  .pop .box{border-top:5px solid var(--brand)} .pop .msg{font-size:15px;line-height:1.45}
  #toasts{position:fixed;bottom:16px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:30}
  .toast{background:#1f2933;color:#fff;padding:10px 14px;border-radius:8px;font-size:13px;max-width:340px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
  .toast.err{background:var(--late)}
  .loading{padding:40px;text-align:center;color:var(--muted)}
  /* event date range filter (front-end only) */
  .datebar{align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
  .datebar b{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
  .datebar .dbinfo{font-size:12px;color:var(--muted)}
  .datebar.on{border-color:var(--brand);background:#f9fafb}
  .datebar.on .dbinfo{color:var(--brand);font-weight:600}
  @media (max-width:1100px){ .panels{grid-template-columns:1fr} }
  @media (max-width:700px){
    .cards{grid-template-columns:repeat(2,1fr)} .kv{grid-template-columns:1fr} header .who{width:100%} .row2{grid-template-columns:1fr}
    header{padding:8px 12px;gap:8px} header .brand{font-size:15px} header .sync{display:none} #viewbtn{display:none}
    .wrap{padding:12px} .tab{padding:6px 10px;font-size:13px} .card .n{font-size:18px} .card{padding:10px}
    .grid .ev{min-width:140px;max-width:150px}
  }
  body.mobile .panels{grid-template-columns:1fr}
  body.mobile .cards{grid-template-columns:repeat(2,1fr)} body.mobile .kv{grid-template-columns:1fr} body.mobile .row2{grid-template-columns:1fr}
  body.mobile header{padding:8px 12px;gap:8px} body.mobile header .brand{font-size:15px} body.mobile header .who{width:100%} body.mobile header .sync{display:none}
  body.mobile .wrap{padding:12px} body.mobile .tab{padding:6px 10px;font-size:13px} body.mobile .card .n{font-size:18px} body.mobile .card{padding:10px}
  body.mobile .grid .ev{min-width:140px;max-width:150px} body.mobile header select{max-width:100%}
  body.mobile .box{max-width:370px}

  /* ===== Office theme: neutral, flat, minimal colour (colour only where it means something) ===== */
  :root{
    --brand:#1f2937; --bg:#f3f4f6; --ink:#111827; --muted:#6b7280; --line:#d9dce1;
    --late:#b42318; --lateBg:#fdf1f0; --ok:#1f6f43; --okBg:#eef6f1; --due:#8a5a00; --dueBg:#fbf6ea;
    --up:#4b5563; --upBg:#f3f4f6; --chip:#f3f4f6;
    --L2O:#374151; --O2D:#374151; --PE:#374151;
  }
  body{font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13.5px}
  header{background:#fff;color:var(--ink);border-bottom:1px solid var(--line);box-shadow:none}
  header .who,header .sync{opacity:1;color:var(--muted)}
  header select{border:1px solid var(--line)}
  .iconbtn{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:4px;font-weight:500}
  .iconbtn:hover{background:#f3f4f6}
  .badge{background:var(--late);top:-7px;right:-7px}
  .testtag{background:#fff;color:var(--late);border:1px solid var(--late);border-radius:3px}
  .bar{gap:0;border-bottom:1px solid var(--line);margin-bottom:14px}
  .tab{border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;color:var(--muted);font-weight:600;padding:9px 14px;margin-bottom:-1px}
  .tab:hover{color:var(--ink)}
  .tab.on{background:transparent;color:var(--ink);border-bottom-color:var(--ink)}
  .scope{border-radius:4px;margin-bottom:6px} .scope button{padding:6px 12px}
  .scope button.on{background:var(--brand);color:#fff}
  .bar > .btn{margin-bottom:6px;margin-left:8px}
  .btn{border-radius:4px;font-weight:600;background:var(--brand);border-color:var(--brand)}
  .btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
  .btn.red,#m_go[style*="--late"]{background:#fff !important;color:var(--late) !important;border-color:var(--late) !important}
  .card{border-radius:4px;box-shadow:none}
  .card .n{font-weight:600;color:var(--ink)} .card.ok .n{color:var(--ink)} .card.late .n{color:var(--late)}
  .panel,.tablewrap,.box{border-radius:4px}
  .panel h4{background:#f9fafb !important;color:var(--ink);border-bottom:1px solid var(--line);font-size:13px;font-weight:600}
  .panel h4 small{color:var(--muted);opacity:1}
  th{background:#f9fafb;color:#4b5563}
  tr.click:hover td{background:#f6f7f9}
  .pill{border-radius:3px;font-weight:500;background:#f3f4f6;color:#374151}
  .pill[style]{color:#374151 !important;background:#f3f4f6}
  .tag{border-radius:3px}
  .tag.new{background:#fff;color:#374151;border:1px solid #9ca3af} .tag.new.stale{background:#fff;color:var(--late);border-color:var(--late)}
  .s-pending,.s-inprogress,.s-onhold{background:#f3f4f6;color:#374151}
  .s-done{background:var(--okBg);color:var(--ok)} .s-cancelled{background:#f3f4f6;color:#6b7280}
  select.st{border-radius:4px}
  .estat,.filters select,.filters input{border-radius:4px}
  .typesel button{border-radius:4px} .typesel button.on{background:#f3f4f6;color:var(--ink);border-color:var(--ink)}
  .grid thead tr:first-child th{background:#eceef1 !important;color:#111827 !important;border-bottom:1px solid var(--line)}
  .c{border-radius:3px;font-weight:500}
  .c.mk{background:#fff;color:#374151;border:1px dashed #6b7280}
  .box h3{color:var(--ink)}
  .pop .box{border-top:3px solid var(--brand)}
  .toast{border-radius:4px}
  .modal{background:rgba(17,24,39,.4)}
  /* Today snapshot (full screen) */
  #snap{position:fixed;inset:0;z-index:40;background:#eef0f3;display:none;flex-direction:column}
  .snap-bar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line)}
  .snap-bar input{padding:5px 8px;border:1px solid var(--line);border-radius:4px}
  #snap_wrap{flex:1;overflow:auto;padding:10px}
  #snapArea{background:#fff;padding:1em 1.1em;border:1px solid var(--line);font-size:15px;color:var(--ink)}
  .sn-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--ink);padding-bottom:.45em;margin-bottom:.7em;gap:1em}
  .sn-title{font-weight:700;font-size:1.35em} .sn-date{font-size:1em;color:#374151}
  .sn-sum{text-align:right;font-size:.85em;color:#374151;line-height:1.5} .sn-st{margin-left:.6em;white-space:nowrap} .sn-st.done{color:var(--ok)}
  .sn-grid{columns:17em;column-gap:.6em}
  .sn-card{border:1px solid var(--line);border-radius:4px;padding:.45em .6em;break-inside:avoid;display:inline-block;width:100%;margin-bottom:.6em}
  .sn-who{font-weight:700;border-bottom:1px solid #e5e7eb;padding-bottom:.25em;margin-bottom:.3em;display:flex;justify-content:space-between}
  .sn-who span{font-weight:600;color:var(--muted);font-size:.85em}
  .sn-it{display:flex;gap:.45em;padding:.2em 0;line-height:1.25} .sn-it + .sn-it{border-top:1px dotted #e5e7eb}
  .sn-ic{width:1em;flex:none;text-align:center;color:#374151} .sn-it.done .sn-ic{color:var(--ok)} .sn-it.done .sn-tx{color:var(--muted)}
  .sn-ev{font-size:.8em;color:var(--muted)} .sn-tx{font-size:.95em}
  .carry{display:inline-block;margin-left:6px;font-size:11px;color:#4b5563;border:1px solid var(--line);border-radius:3px;padding:0 5px;white-space:nowrap}
  .sn-carry{font-size:.78em;color:var(--muted);white-space:nowrap}
  /* Event Calendar */
  .cal-month{font-size:16px;min-width:150px;text-align:center}
  #cal_q{min-width:220px}
  .cal-legend{display:flex;gap:12px;font-size:12px;color:#374151;margin-left:auto;align-items:center}
  .cal-legend span{display:inline-flex;align-items:center;gap:5px}
  .cal-sw{width:12px;height:12px;border-radius:3px;display:inline-block}
  .cal-sw.kc{background:#e3f3ea;border:1px solid #9fd3b5;border-left:3px solid #1f7a4d}
  .cal-sw.ko{background:#eaf2fb;border:1px solid #b9d3ef;border-left:3px solid #1d5fa8}
  .cal-sw.kh{background:#f3f4f6;border:1px dashed #6b7280}
  .cal-sum{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .cal-sum div{background:#fff;border:1px solid var(--line);border-radius:4px;padding:6px 12px;font-size:12px;color:var(--muted)}
  .cal-sum b{font-size:15px;color:var(--ink);margin-right:4px}
  .cal-nodate{background:#fff;border:1px dashed var(--line);border-radius:4px;padding:6px 10px;margin-bottom:10px;font-size:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .cal-nodate .cal-ev{width:auto;margin:0}
  .cal{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden}
  .cal-dow{display:grid;grid-template-columns:repeat(7,1fr);background:#f9fafb;border-bottom:1px solid var(--line)}
  .cal-dow div{padding:7px 8px;font-size:11px;font-weight:700;color:#4b5563;text-transform:uppercase;letter-spacing:.3px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
  .cal-day{min-height:112px;border-right:1px solid #eceef1;border-bottom:1px solid #eceef1;padding:5px 6px;background:#fff;min-width:0}
  .cal-day:nth-child(7n){border-right:0} .cal-day.other{background:#fafafa} .cal-day.other .cal-dn{color:#c0c4cc}
  .cal-dn{font-size:12px;font-weight:600;color:#374151;margin-bottom:4px;display:flex;justify-content:space-between}
  .cal-dn em{font-style:normal;font-weight:500;color:var(--muted)}
  .cal-day.today .cal-dn span{background:var(--brand);color:#fff;border-radius:10px;padding:0 7px}

  @media (max-width:800px){ .cal-day{min-height:64px;padding:3px} .cal-ev{font-size:0;height:8px;padding:0;margin-bottom:2px} .cal-legend{margin-left:0} #cal_q{min-width:0;flex:1} }
  /* Notification list */

  /* On Hold enquiries */

  /* Live Updates: grouped Date → Doer view + multi-event add form */

  table.lug tr.lu-done td:not(.g-dt):not(.g-who){color:var(--muted)}
  .lu-line{border:1px solid var(--line);border-radius:4px;padding:8px 12px 10px;margin-top:10px;background:#fafafa}

<body>
<div id="app">
<header>
  <span class="brand">CRES · Task Dashboard</span>
  <span id="testtag"></span>
  <span class="who" id="who">Loading…</span>
  <span class="sp"></span>
  <span class="sync" id="sync"></span>
  <span id="viewas"></span>
  <button class="iconbtn" id="viewbtn" onclick="toggleView()" title="Preview how the dashboard looks on a phone">Mobile view</button>
  <button class="iconbtn" onclick="reopenNotifs()" title="Notifications">Notifications<span id="bellc"></span></button>
  <button class="iconbtn" id="refbtn" onclick="hardRefresh()" title="Refresh from FMS now">Refresh</button>
</header>

<div class="wrap">
  <div id="errors"></div>
  <div class="bar" id="tabs"></div>
  <div class="cards" id="cards"></div>
  <div class="filters datebar" id="datebar" style="display:none"></div>
  <div class="filters" id="filters"></div>
  <div id="view"><div class="loading">Loading dashboard…</div></div>
</div>

</div>
<div class="modal hidden" id="modal" onclick="if(event.target===this)closeModal()"><div class="box" id="modalBox"></div></div>
<div class="modal pop hidden" id="pop"><div class="box" id="popBox"></div></div>
<div id="toasts"></div>

<script>
const ST = { viewAs:null, boot:null, data:null, tab:null, off:0, ver:0, snooze:{}, popOpen:false,
             f:{ tstatus:'open', who:'', q:'', phase:'all', fwho:'', fev:'', fstate:'pending', cell:'', fuWhen:'both', fuType:'all', fuWho:'', lwhen:'month', lwho:'', lev:'', lst:'', lq:'', ywho:'', yev:'', yq:'' }, yt:'fms' };
const $ = s => document.querySelector(s);
let TOKEN = '';
try{ ST.scope = localStorage.getItem('cresScope') || 'all'; }catch(e){ ST.scope = 'all'; }
// Login is kept only for this tab: closing the tab/link means signing in again
try{ ST.loginEmail = sessionStorage.getItem('cresEm') || ''; }catch(e){}
try{ TOKEN = sessionStorage.getItem('cresTok') || ''; }catch(e){}
try{ localStorage.removeItem('cresTok'); }catch(e){}
function AUTH(){ return { viewAs: ST.viewAs, token: TOKEN }; }
const STAGE_COLOR = { L2O:'var(--L2O)', O2D:'var(--O2D)', PE:'var(--PE)' };

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
let ROUTE = 'post';
try{ const r = localStorage.getItem('cresRoute'); if(['post','get','jsonp'].includes(r)) ROUTE = r; }catch(e){}
function run(fn, ...args){
  const url = (window.CRES_CONFIG && window.CRES_CONFIG.API_URL) || '';
  const fail = (m, e) => { if(/LOGIN_REQUIRED/.test(m)){ showLogin(); } else { toast(m, 'err'); } throw (e || new Error(m)); };
  if(!/^https:\/\/script\.google\.com\//.test(url)) return Promise.reject(new Error('API_URL missing')).catch(e => fail('App not configured: put the Apps Script /exec link in config.js', e));
  const body = JSON.stringify({ fn, args });
  const asJson = r => { if(!r.ok) throw new Error('Server error ' + r.status); return r.json(); };
  // 1) POST as text/plain (no CORS preflight, no Google cookies)
  const viaPost = () => fetch(url, { method:'POST', redirect:'follow', credentials:'omit', cache:'no-store',
                                     headers:{'Content-Type':'text/plain;charset=utf-8'}, body }).then(asJson);
  // 2) Same call as GET — some signed-in Chrome profiles get a 404 from Google on the POST route
  const viaGet = () => fetch(url + '?api=call&q=' + encodeURIComponent(body) + '&_=' + Date.now(),
                             { method:'GET', redirect:'follow', credentials:'omit', cache:'no-store' }).then(asJson);
  // 3) JSONP <script> — behaves like opening the link directly (works under strict managed-Chrome policies)
  const viaJsonp = () => new Promise((res, rej) => {
    const cb = '__cres' + Date.now() + Math.floor(Math.random()*1e4), sc = document.createElement('script');
    const done = () => { clearTimeout(t); try{ delete window[cb]; }catch(e){ window[cb] = undefined; } sc.remove(); };
    const t = setTimeout(() => { done(); rej(new Error('timeout')); }, 30000);
    window[cb] = j => { done(); res(j); };
    sc.onerror = () => { done(); rej(new Error('Server error (script)')); };
    sc.src = url + '?api=call&callback=' + cb + '&q=' + encodeURIComponent(body) + '&_=' + Date.now();
    document.head.appendChild(sc);
  });
  // Remember which route works on this device and use it first next time
  const routes = { post: viaPost, get: viaGet, jsonp: viaJsonp };
  const order = [ROUTE].concat(['post','get','jsonp'].filter(r => r !== ROUTE));
  const attempt = i => routes[order[i]]().then(j => { ROUTE = order[i]; try{ localStorage.setItem('cresRoute', ROUTE); }catch(e){} return j; },
                                               e => i + 1 < order.length ? attempt(i + 1) : Promise.reject(e));
  const first = attempt(0);
  return first
    .catch(e => fail(navigator.onLine ? ('Could not reach the server (' + ((e && e.message) || 'network') + '). Try again.') : 'You are offline.', e))
    .then(j => { if(!j || !j.ok) fail((j && j.error) || 'Unknown error'); return j.data; });
}
function toast(msg, kind){
  const d = document.createElement('div'); d.className = 'toast ' + (kind||''); d.textContent = msg;
  $('#toasts').appendChild(d); setTimeout(()=>d.remove(), kind==='err'?7000:3500);
}
function now(){ return Date.now() + ST.off; }
function fmt(ms){
  if(!ms) return '—';
  const d = new Date(ms);
  return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',timeZone:'Asia/Kolkata'}) + ', ' +
         d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Kolkata'});
}
function fmtShort(ms){ return new Date(ms).toLocaleDateString('en-GB',{day:'2-digit',month:'short',timeZone:'Asia/Kolkata'}); }
function dayKey(ms){ return new Date(ms).toLocaleDateString('en-GB',{timeZone:'Asia/Kolkata'}); }
function dur(ms){
  const m = Math.floor(Math.abs(ms)/60000), d = Math.floor(m/1440), h = Math.floor((m%1440)/60), mm = m%60;
  return d ? d+'d '+h+'h' : h ? h+'h '+mm+'m' : mm+'m';
}
function delayOf(planned, actual, cancelled){
  if(!planned || cancelled) return {txt:'—', cls:'muted'};
  const diff = (actual || now()) - planned;
  if(diff > 0) return {txt:'+'+dur(diff), cls:'late'};
  return actual ? {txt:'On time', cls:'ok'} : {txt:dur(diff)+' left', cls:'muted'};
}
function sCls(s){ return 's-' + String(s||'').toLowerCase().replace(/\s+/g,''); }
function isOpen(t){ return t.status!=='Done' && t.status!=='Cancelled'; }
function isLate(t){ return isOpen(t) && t.planned && now() > t.planned; }
function me(){ return ST.boot.me; }
function stageLabel(k){ return (ST.boot.stageLabels.find(s=>s.key===k)||{}).label || k; }
function nameN(s){ return String(s||'').trim().toLowerCase(); }

/* ---------------- boot ---------------- */
async function init(){
  const v = ++ST.ver;
  $('#view').innerHTML = '<div class="loading">Loading dashboard…</div>';
  try{
    const b = await run('getBootstrap', AUTH());
    if(v !== ST.ver) return;
    ST.boot = b; ST.viewAs = b.me.id; ST.off = b.serverNow - Date.now();
    renderHeader();
    await load();
    clearInterval(ST.pollT); ST.pollT = setInterval(()=>load(false, true), b.poll*1000);
    clearInterval(ST.tickT); ST.tickT = setInterval(()=>{ if($('#modal').classList.contains('hidden')) render(); }, 60000);
  }catch(e){
    const m = (e && e.message) || String(e);
    if(!/LOGIN_REQUIRED/.test(m)) $('#view').innerHTML = '<div class="empty">'+esc(m)+'</div>';
    $('#who').textContent = '';
  }
}
async function load(force, quiet){
  const v = ST.ver;
  const d = await run('getData', AUTH(), !!force);
  if(v !== ST.ver) return;
  ST.data = d; ST.off = d.serverNow - Date.now();
  $('#sync').textContent = 'FMS synced ' + new Date(d.syncedAt).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Kolkata'});
  if(!(quiet && !$('#modal').classList.contains('hidden'))) render();
  handleNotifs(d.notifs || []);
}
async function hardRefresh(){
  const b = $('#refbtn'); b.disabled = true;
  try{ await load(true); toast('Fresh data loaded from FMS and the enquiry form'); } finally{ b.disabled = false; }
}

function renderHeader(){
  const m = me();
  $('#who').innerHTML = '<b>'+esc(m.name)+'</b> · '+esc(m.roleLabel)+' · '+esc(m.id);
  $('#testtag').innerHTML = ST.boot.test ? '<span class="testtag">TEST MODE</span>' : '';
  if(ST.boot.pinUser) $('#who').innerHTML += ' · <a href="#" style="color:inherit" onclick="logout();return false">Log out</a>';
  $('#viewas').innerHTML = ST.boot.test
    ? 'View as: <select onchange="switchUser(this.value)">' +
        ST.boot.people.map(p=>'<option value="'+p.id+'" '+(p.id===m.id?'selected':'')+'>'+esc(p.name)+' — '+esc(p.roleLabel)+'</option>').join('') +
      '</select>'
    : '';
}
// "View as" = sign in as that person: log out and show the login page with their email filled in
// "View as" (testing): every switch asks for the ADMIN's own PIN again, then opens that person's dashboard
async function switchUser(id){
  const p = (ST.boot.people||[]).find(x=>x.id===id) || {};
  closeModal(); closePop();
  try{ await run('pinLogout', TOKEN); }catch(e){}
  TOKEN = ''; try{ sessionStorage.removeItem('cresTok'); }catch(e){}
  ST.pendingViewAs = id;
  ST.viewAs = null; ST.tab = null; ST.snooze = {}; ST.f.who=''; ST.f.fwho=''; ST.data = null; ST.boot = null;
  showLogin('', ST.loginEmail || '', 'Enter YOUR PIN to open ' + (p.name||id) + '\'s dashboard.');
}
function goTab(t){ ST.tab = t; render(); }

/* ---------------- render ---------------- */
// Remember where every table (and the page) was scrolled, so auto-refresh doesn't jump back to the top
function captureScroll(){
  return { y: window.scrollY,
           els: [...document.querySelectorAll('#view .scroll, #view .tablewrap')].map(e=>[e.scrollTop, e.scrollLeft]) };
}
function restoreScroll(st){
  if(!st) return;
  [...document.querySelectorAll('#view .scroll, #view .tablewrap')].forEach((e,i)=>{
    if(st.els[i]){ e.scrollTop = st.els[i][0]; e.scrollLeft = st.els[i][1]; }
  });
  window.scrollTo(0, st.y);
}

function render(){
  if(!ST.data) return;
  const keep = ST.renderedTab === ST.tab ? captureScroll() : null;
  const minH = document.body.offsetHeight;                 // stop the page shrinking mid-redraw
  document.body.style.minHeight = minH + 'px';
  const ae = document.activeElement, aid = ae && ae.id && ae.tagName === 'INPUT' && ae.type !== 'date' ? ae.id : '';
  const ss = aid ? ae.selectionStart : 0, se = aid ? ae.selectionEnd : 0;
  try{ renderInner(); } finally{
    restoreScroll(keep);
    if(aid){ const el = document.getElementById(aid); if(el && el !== document.activeElement){ el.focus(); try{ el.setSelectionRange(ss, se); }catch(e){} } }
    ST.renderedTab = ST.tab;
    document.body.style.minHeight = '';
  }
}
function renderInner(){
  const d = ST.data;
  $('#errors').innerHTML = (d.errors||[]).length
    ? '<div class="errors"><b>Source read error:</b> '+d.errors.map(esc).join(' · ')+'</div>' : '';
  // Your Tasks is the first tab (opens by default), then Dashboard
  const tabs = [['fms','Your Tasks'],['dash','Dashboard'],['tracker','Event Tracker'],['cal','Event Calendar']];   // One-off Tasks tab removed for now
  if(me().isPC) tabs.splice(1, 0, ['follow','Follow-ups']);
  tabs.push(['live','Live Updates']);                 // after One-off Tasks — everyone can view
  if(!tabs.some(t=>t[0]===ST.tab)) ST.tab = tabs[0][0];
  let h = tabs.map(t=>'<button class="tab '+(t[0]===ST.tab?'on':'')+'" onclick="goTab(\''+t[0]+'\')">'+t[1]+'</button>').join('');
  h += '<span style="flex:1"></span>';
  if(me().mineToggle && ST.tab!=='follow'){
    h += '<span class="scope"><button class="'+(ST.scope!=='mine'?'on':'')+'" onclick="setScope(\'all\')">All</button>' +
         '<button class="'+(ST.scope==='mine'?'on':'')+'" onclick="setScope(\'mine\')">Mine</button></span>';
  }
  // Enquiry allocation and One-off Tasks removed (21 Nov 2026)
  $('#tabs').innerHTML = h;
  renderCards();
  renderDateBar();
  ({dash:renderDash, tracker:renderTracker, cal:renderCal, fms:renderFms, follow:renderFollow, live:renderLive})[ST.tab]();
}

/* ---------------- All / Mine scope (for people who can see everything) ---------------- */
function scopeMine(){ return !!me().mineToggle && ST.scope==='mine'; }
function mineOnly(){ return !me().seeAll || scopeMine(); }
function isMineEvent(e){
  const n = nameN(me().name);
  if(nameN(e.lead)===n || (e.alloc && nameN(e.alloc.toName)===n)) return true;
  return ['L2O','O2D','PE'].some(k=>(e.cells[k]||[]).some(x=>nameN(x[4])===n));
}
// Dashboard tables: everyone sees all confirmed + ongoing events; "Mine" narrows them
/* ---------------- Event date range filter (front-end only, backend untouched) ----------------
   Filters ONLY on each event's Event Date (DD/MM/YYYY) — not on planned / task dates.
   An event outside the range is hidden everywhere, including its pending FMS steps in Your Tasks.
   Applies to: Your Tasks (FMS Tasks), Dashboard, Event Tracker and the summary cards.
   Not applied to: Follow-ups (PC), PMS Tasks, Live Updates. Events with no readable Event Date are hidden while a range is set. */
ST.dr = { from:'', to:'' };                       // 'YYYY-MM-DD' from the date inputs
try{ const s = JSON.parse(localStorage.getItem('cresDates')||'{}'); ST.dr.from = s.from||''; ST.dr.to = s.to||''; }catch(e){}
function dayNum(y,m,d){ return y*10000 + m*100 + d; }               // 2026-11-03 → 20261103 (no time zone issues)
function evDayNum(e){
  const m = String(e.eventDate||'').trim().match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);   // DD/MM/YYYY
  return m ? dayNum(+m[3], +m[2], +m[1]) : null;
}
function inputDayNum(v){ const m = String(v||'').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? dayNum(+m[1], +m[2], +m[3]) : null; }
function dateOn(){ return !!(ST.dr.from || ST.dr.to); }
function inRange(e){
  if(!dateOn()) return true;
  const n = evDayNum(e); if(n==null) return false;
  const f = inputDayNum(ST.dr.from), t = inputDayNum(ST.dr.to);
  return (f==null || n>=f) && (t==null || n<=t);
}
function dateEVS(){ return ST.data.events.filter(inRange); }
function setDates(){
  ST.dr.from = $('#dr_from').value; ST.dr.to = $('#dr_to').value;
  if(ST.dr.from && ST.dr.to && ST.dr.from > ST.dr.to){ toast('From date is after To date', 'err'); }
  try{ localStorage.setItem('cresDates', JSON.stringify(ST.dr)); }catch(e){}
  render();
}
function clearDates(){ ST.dr.from=''; ST.dr.to=''; try{ localStorage.removeItem('cresDates'); }catch(e){} $('#dr_from').value=''; $('#dr_to').value=''; render(); }
function fmtIn(v){ const m = String(v).match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? m[3]+'/'+m[2]+'/'+m[1] : ''; }
function renderDateBar(){
  const bar = $('#datebar');
  const show = ['dash','tracker'].includes(ST.tab) || (ST.tab==='fms' && ST.yt!=='lu');
  bar.style.display = show ? 'flex' : 'none';
  if(!show) return;
  if(!$('#dr_from')){                 // built once, so the auto refresh never closes an open date picker
    bar.innerHTML = '<b>Event date</b>' +
      '<span class="small">From</span><input type="date" id="dr_from" onchange="setDates()">' +
      '<span class="small">To</span><input type="date" id="dr_to" onchange="setDates()">' +
      '<button class="btn ghost sm" onclick="clearDates()">Clear</button>' +
      '<span class="dbinfo" id="dr_info"></span>';
  }
  if($('#dr_from').value !== ST.dr.from) $('#dr_from').value = ST.dr.from;
  if($('#dr_to').value !== ST.dr.to) $('#dr_to').value = ST.dr.to;
  bar.classList.toggle('on', dateOn());
  $('#dr_info').textContent = dateOn()
    ? 'Showing ' + dateEVS().length + ' event(s) dated ' + (ST.dr.from ? fmtIn(ST.dr.from) : 'any') + ' → ' + (ST.dr.to ? fmtIn(ST.dr.to) : 'any')
    : 'All dates';
}

function EVS(){ const b = dateEVS(); return scopeMine() ? b.filter(isMineEvent) : b; }
// Event Tracker / FMS steps: people who don't see everything only get their own events
function trackEVS(){ const b = dateEVS(); return mineOnly() ? b.filter(isMineEvent) : b; }
function setScope(s){ ST.scope = s; try{ localStorage.setItem('cresScope', s); }catch(e){} render(); }

// "Your Tasks" admins — only these people see everyone's tasks and the employee dropdown.
// Everyone else (incl. other Event Heads) sees only their own tasks here.
var TASK_ADMINS = ['salauddin','pratik','jigar','kunal','ashwini'];
function isTaskAdmin(){ return TASK_ADMINS.indexOf(nameN(me().name)) >= 0; }
// Every pending FMS step across all events, with no role filtering (used by Your Tasks + its cards)
function allPendingSteps(noDate){
  const out = [];
  (noDate ? ST.data.events : dateEVS()).forEach(ev=>{          // noDate = Follow-ups: date filter not applied
    ['L2O','O2D','PE'].forEach(k=>{
      const cells = ev.cells[k]; if(!cells) return;
      cells.forEach((x,i)=>{
        if(x[0]!=='pending') return;
        if(markFor(ev.id, k, i)) return;          // marked in the dashboard → waits for Ashwini, not in anyone's task list
        out.push({ ev, stage:k, stepNo:i, kind:ST.data.steps[k][i].kind, step:ST.data.steps[k][i].name, planned:x[1], doer:x[4] });
      });
    });
  });
  return out;
}
// Tasks this person should see in Your Tasks: admins see everyone, everyone else sees only their own
function myPendingSteps(){
  return isTaskAdmin() ? allPendingSteps() : allPendingSteps().filter(p=>nameN(p.doer)===nameN(me().name));
}
function pendingSteps(ignoreScope){
  const out = allPendingSteps(ignoreScope);
  return (me().seeAll && (ignoreScope || !mineOnly())) ? out : out.filter(p=>nameN(p.doer)===nameN(me().name));
}

function renderCards(){
  const evs = EVS();
  // "My tasks overdue" counts the same tasks the Your Tasks tab shows for this person:
  // admins (owner/PC) see everyone's; every other person sees only their own.
  const myPend = myPendingSteps();
  const ong = evs.filter(isOngoing).length;
  const conf = evs.filter(isConf).length;
  $('#cards').innerHTML =
    card(ong,'Ongoing enquiries','',"cardGo('tracker','phase','Ongoing')") +
    card(conf,'Confirmed events','ok',"cardGo('tracker','phase','Confirmed')") +
    card(myPend.filter(p=>p.planned < now()).length, isTaskAdmin()?'Tasks overdue':'My tasks overdue','late',"cardGo('fms','fstate','late')");
}
// Summary card click → open that tab with the matching filter already set
function cardGo(tab, key, val){ ST.f[key] = val; if(tab==='fms'){ ST.yt='fms'; ST.f.fwho=''; ST.f.fev=''; ST.f.ytq=''; } goTab(tab); }
// Confirmed on the Dashboard tab = in Order-to-Delivery FMS, or marked Confirmed on the dashboard
function isConf(e){ return e.phase==='Confirmed' || !!e.dashConfirmed; }
// Ongoing = not confirmed AND no confirmed event with the same Event ID number
// (stops one event showing in both lists when an FMS/form writes its ID differently, e.g. EVT-099 vs EVT-0099)
function isOngoing(e){
  if(isConf(e)) return false;
  const d = ST.data;
  if(d._confNumsFor !== d.events){ d._confNums = new Set((d.events||[]).filter(isConf).map(x=>x.num)); d._confNumsFor = d.events; }
  return !d._confNums.has(e.num);
}
function card(n,l,c,go){ return '<div class="card '+c+(go?' go':'')+'"'+(go?' onclick="'+go+'" title="Click to open"':'')+'><div class="n">'+n+'</div><div class="l">'+l+'</div></div>'; }
function tags(e){
  let nw = '';
  if(e.isNew && e.phase==='Ongoing'){
    const age = e.newSince ? now() - e.newSince : 0;
    nw = age > 864e5*1 ? '<span class="tag new stale" title="No action for over 24h (Client Briefing not done)">NEW · '+dur(age).split(' ')[0]+'</span>'
                       : '<span class="tag new" title="Client Briefing not done yet">NEW</span>';
  }
  if(e.hold && e.phase==='Ongoing') nw += '<span class="tag hold" title="'+esc(holdTitle(e))+'">ON HOLD</span>';
  return nw;            // NEW and ON HOLD tags only (ongoing enquiries)
}
function holdTitle(e){ const h = e.hold||{}; return 'On hold' + (h.at?' since '+fmtShort(h.at):'') + (h.byName?' · '+h.byName:'') + (h.note?' · '+h.note:''); }
function leadCell(e){ return e.lead ? esc(e.lead) : '<span class="muted">—</span>'; }
// Event Name (from the enquiry form; blank for older enquiries)
function evName(e){ return (e && e.eventName) ? String(e.eventName) : ''; }
function evNameCell(e){ return evName(e) ? esc(evName(e)) : '<span class="muted">—</span>'; }
function evNameLine(e){ return evName(e) ? '<div class="small">'+esc(evName(e))+'</div>' : ''; }
// Remark = "Remark" column of the CRES Enquiry Capture form (already sent by the backend as form.remark)
function remarkCell(e){
  const r = e && e.form ? String(e.form.remark||'').trim() : '';           // from the enquiry form (read-only)
  const h = e && e.hold ? '<div class="hold-note">⏸ Hold'+(e.hold.note ? ': '+esc(e.hold.note) : (e.hold.at ? ' since '+fmtShort(e.hold.at) : ''))+'</div>' : '';
  return (r ? esc(r) : (h ? '' : '<span class="muted">—</span>')) + h;
}
function evNameById(id){ return evName((ST.data.events||[]).find(x=>x.id===id)); }

   and only matching events stay in Confirmed Events / Ongoing Enquiries. Works together with the date filter. */
function dashMatch(e){
  const q = String(ST.f.dq||'').trim().toLowerCase();
  if(!q) return true;
  return [e.id, e.company, e.client, e.eventName, e.lead, e.eventDate].join(' ').toLowerCase().includes(q);
}
function renderDash(){

    $('#filters').innerHTML = '<input id="dash_q" style="min-width:300px" placeholder="Search event — ID, company, client, event name, doer…" ' +
      'oninput="ST.f.dq=this.value;renderDashBody()">' +

          (e.dashConfirmed ? '<div class="small muted" title="Confirmed on the dashboard — Ashwini to set Event Confirmed = Yes in the enquiry form">Form update pending</div>'
            : e.inO2D===false ? '<div class="small muted" title="Event Confirmed = Yes in the form — Order to Delivery FMS not created yet">O2D FMS pending</div>' : '') + '</td>' +
        '<td class="mono">'+e.id+'</td><td><b>'+esc(e.company)+'</b>'+
        '</td><td>'+evNameCell(e)+'</td><td class="rmk">'+remarkCell(e)+'</td><td>'+esc(e.client)+'</td><td>'+esc(e.eventDate||'—')+'</td><td>'+leadCell(e)+'</td></tr>').join('') +
      '</tbody></table>');

  const p2 = panel('Ongoing Enquiries', 'Lead to Order FMS', 'var(--L2O)',
    '<table><thead><tr><th class="srn">Sr.</th><th>Status</th><th>Client</th><th>Company</th><th>Event Name</th><th>Remark</th><th>Approx Event Date</th></tr></thead><tbody>' +
      ong.map((e,n)=>'<tr class="click'+(e.hold?' hold':'')+'" onclick="eventModal(\''+e.id+'\')"><td class="srn">'+(n+1)+'</td>' +
        '<td onclick="event.stopPropagation()">'+ongStatusSelect(e)+'</td>' +
        '<td>'+esc(e.client)+'</td><td><b>'+esc(e.company)+'</b>'+
        tags(e)+'<div class="mono">'+e.id+(e.lead?' · '+esc(e.lead):'')+'</div></td><td>'+evNameCell(e)+'</td><td class="rmk">'+remarkCell(e)+'</td><td>'+esc(e.eventDate||'—')+'</td></tr>').join('') +
      '</tbody></table>');

  // Layout: Confirmed Events | Ongoing Enquiries. Mine: empty panels are hidden.
  const mine = scopeMine();
  const left  = (!mine || conf.length) ? p1 : '';
  const right = (!mine || ong.length) ? p2 : '';
  const top = [left, right].filter(Boolean);

    (top.length ? '<div class="panels" style="--cols:1fr 1fr">' + top.map(x=>'<div class="col">'+x+'</div>').join('') + '</div>' : '');

function panel(title, sub, color, body){
  return '<div class="panel"><h4 style="background:'+color+'">'+title+'<small>'+sub+'</small></h4><div class="scroll">'+body+'</div></div>';
}

/* ---------------- event tracker grid (FMS style) ---------------- */
function cellState(x){
  if(!x) return '';
  if(x[0]==='done' || x[0]==='no') return x[0];
  if(x[0]==='pending'){ const n = now(); return x[1] < n ? 'late' : dayKey(x[1])===dayKey(n) ? 'due' : 'up'; }
  return '';
}
// Active (not yet synced) dashboard mark for one FMS step
function markFor(evId, stage, i){
  return (ST.data.marks||[]).find(m=>!m.synced && m.eventId===evId && m.stage===stage && m.stepNo===i);
}
function cellHtml(x, stepName, stage, ev, i){
  if(!x) return '';
  const mk = (ev && i!=null && x[0]==='pending') ? markFor(ev.id, stage, i) : null;
  if(mk) return '<span class="c mk" title="'+esc(stepName+'\nMarked '+mk.value+' by '+mk.byName+' at '+fmt(mk.at)+' — waiting for the FMS update')+'">✓ '+esc(mk.value)+'*</span>';
  const [state, planned, actual, status, doer] = x;
  const tip = esc(stepName+'\nPlanned: '+fmt(planned)+'\nActual: '+fmt(actual)+'\nStatus: '+(status||'—')+'\nDoer: '+(doer||'—'));
  if(state==='done') return '<span class="c done" title="'+tip+'">'+esc(status||'Done')+'</span>';
  if(state==='no')   return '<span class="c no" title="'+tip+'">No</span>';
  if(state==='pending'){
    const n = now(), cls = planned < n ? 'late' : dayKey(planned)===dayKey(n) ? 'due' : 'up';
    return '<span class="c '+cls+'" title="'+tip+'">'+(cls==='late' ? '+'+dur(n-planned) : fmtShort(planned))+'</span>';
  }
  return '';
}
function renderTracker(){
  const f = ST.f;
  $('#filters').innerHTML =
    '<select onchange="ST.f.phase=this.value;render()">' +
      [['all','All events'],['Ongoing','Ongoing enquiries'],['Confirmed','Confirmed events']]
        .map(o=>'<option value="'+o[0]+'" '+(f.phase===o[0]?'selected':'')+'>'+o[1]+'</option>').join('') + '</select>' +
    '<input placeholder="Search company / event name / EVT…" value="'+esc(f.q)+'" oninput="ST.f.q=this.value;renderTrackerTable()">';
  renderTrackerTable();
}
function renderTrackerTable(){
  const f = ST.f, q = f.q.trim().toLowerCase(), steps = ST.data.steps;
  const evs = trackEVS().filter(e=>{
    if(f.phase==='Confirmed' && !isConf(e)) return false;
    if(f.phase==='Ongoing' && !isOngoing(e)) return false;
    if(q && !(e.company+' '+e.id+' '+e.client+' '+evName(e)).toLowerCase().includes(q)) return false;
    return true;
  });
  const stages = ['L2O','O2D','PE'];
  const want = f.cell || '';
  const cols = [];                                    // [stage, stepIndex] that remain visible
  stages.forEach(k=>steps[k].forEach((s,i)=>{
    if(!want || evs.some(e=>e.cells[k] && cellState(e.cells[k][i])===want)) cols.push([k,i]);
  }));
  const rows = want ? evs.filter(e=>cols.some(([k,i])=>e.cells[k] && cellState(e.cells[k][i])===want)) : evs;
  const chip = (st,label)=>'<span class="c '+(st||'all')+' chipf'+(want===st?' sel':'')+'" onclick="ST.f.cell=\''+st+'\';renderTrackerTable()">'+label+'</span>';
  let h = '<div class="legend">'+chip('','All')+chip('done','Done')+chip('late','+delay')+chip('due','due today')+chip('up','upcoming')+chip('no','No') +
    ' · click a colour to show only those steps · hover a cell for details · click an event for the full view</div>';
  h += '<div class="tablewrap" style="max-height:72vh"><table class="grid"><thead><tr><th class="sr" rowspan="2" style="top:0">Sr.</th><th class="ev" rowspan="2" style="top:0">Event</th>' +
    stages.map(k=>{ const n = cols.filter(c=>c[0]===k).length;
      return n ? '<th colspan="'+n+'" style="background:'+STAGE_COLOR[k]+'">'+esc(stageLabel(k))+'</th>' : ''; }).join('') + '</tr><tr>' +
    cols.map(([k,i])=>'<th>'+esc(steps[k][i].name)+'</th>').join('') + '</tr></thead><tbody>';
  if(!rows.length) h += '<tr><td class="ev" colspan="99"><div class="empty">'+(want?'No steps in this state.':'No events.')+'</div></td></tr>';
  // Sr. No counts only the rows shown (lost enquiries and filtered-out events are skipped)
  rows.forEach((e, n)=>{
    h += '<tr><td class="sr">'+(n+1)+'</td><td class="ev"><span class="link click" style="font-weight:700;color:var(--brand);cursor:pointer" onclick="eventModal(\''+e.id+'\')">'+esc(e.company||'—')+'</span>' +
      tags(e) + evNameLine(e) +
      '<div class="mono">'+e.id+' · '+(e.lead?esc(e.lead):'—')+'</div></td>';
    cols.forEach(([k,i])=>{
      const x = e.cells[k] ? e.cells[k][i] : null;
      h += '<td>'+(x && (!want || cellState(x)===want) ? cellHtml(x, steps[k][i].name, k, e, i) : '')+'</td>';
    });
    h += '</tr>';
  });
  $('#view').innerHTML = h + '</tbody></table></div>';
}

/* ---------------- event detail modal ---------------- */
function eventModal(id){
  const e = ST.data.events.find(x=>x.id===id); if(!e) return;
  const F = e.form || {};
  let h = '<h3>'+esc(e.company||'—')+' <span class="mono">'+e.id+'</span></h3>' +
    '<div class="kv">'+kv('Event name',evName(e))+kv('Client',e.client)+kv('Event date',e.eventDate)+kv('Stage',e.phase)+(e.hold?kv('On Hold',[e.hold.at?fmtShort(e.hold.at):'', e.hold.byName, e.hold.note].filter(Boolean).join(' · ')):'')+kv('Lead (FMS Doer)',e.lead||'—')+
    (e.form ? kv('Phone',F.phone)+kv('Email',F.email)+kv('Location',F.location)+kv('Event type',F.eventType)+kv('Service',F.service)+
              kv('Captured by',F.capturedBy)+kv('Enquiry date',F.enquiryDate)+kv('Form remark',F.remark) : '') + '</div>';
  if(e.form) h += '<b class="small">EVENT BRIEF</b><div class="brief">'+esc(F.brief||'—')+'</div>';
  ['L2O','O2D','PE'].forEach(k=>{
    const cells = e.cells[k]; if(!cells) return;
    h += '<div class="stagehead" style="color:'+STAGE_COLOR[k]+'">'+esc(stageLabel(k))+'</div>' +
      '<div class="tablewrap"><table><thead><tr><th>Step</th><th>Planned</th><th>Actual</th><th>Status</th><th>Delay</th><th>Doer</th></tr></thead><tbody>';
    ST.data.steps[k].forEach((s,i)=>{
      const x = cells[i]; if(!x || x[0]==='na') return;
      const d = delayOf(x[1], x[2]);
      h += '<tr><td>'+esc(s.name)+'</td><td class="small">'+fmt(x[1])+'</td><td class="small">'+fmt(x[2])+'</td><td>'+cellHtml(x,s.name,k,e,i)+'</td><td class="'+d.cls+'">'+d.txt+'</td><td>'+esc(x[4]||'—')+'</td></tr>';
    });
    h += '</tbody></table></div>';
  });
  h += '<div class="actions"><button class="btn ghost" onclick="closeModal()">Close</button></div>';
  openModal(h, true);
}
function kv(k,v){ return '<b>'+k+'</b><span>'+esc(v||'—')+'</span>'; }

/* ---------------- Your Tasks = two sub-tabs: FMS Tasks | Live Update Tasks ---------------- */
function renderFms(){
  if(ST.yt==='lu') renderMyLu(); else renderFmsSteps();
  // count = open tasks for the chosen Employee / Event filter (same rows the table shows, before search)
  const allLu = me().canEditUpdates && !mineOnly();
  const nLu = myLuList().filter(u=>u.status!=='Done' && !(allLu && ST.f.ywho && u.doer!==ST.f.ywho) && !(ST.f.yev && u.eventId!==ST.f.yev)).length;
  $('#filters').insertAdjacentHTML('afterbegin',
    '<span class="subtabs"><button class="'+(ST.yt!=='lu'?'on':'')+'" onclick="ST.yt=\'fms\';render()">FMS Tasks</button>' +
    '<button class="'+(ST.yt==='lu'?'on':'')+'" onclick="ST.yt=\'lu\';render()">PMS Tasks'+(nLu?' ('+nLu+')':'')+'</button></span>');
}
// Live Update rows for this person: their own (Doer = me); Kunal / Ashwini / Jigar (UPDATE_EDITORS) see everyone's.
// Done rows stay (grey) for 7 days on this page — the sheet keeps them for ever.
function myLuList(){
  const id = me().id, all = me().canEditUpdates && !mineOnly(), cut = now() - 7*86400000;
  return (ST.data.updates||[]).filter(u=>(all || u.doer===id) && (u.status!=='Done' || (u.doneAt||u.updAt||0) >= cut));
}
function renderMyLu(){
  const f = ST.f, all = me().canEditUpdates && !mineOnly(), base = myLuList(), myId = me().id;
  const o = (v, l, cur) => '<option value="'+esc(v)+'" '+(cur===v?'selected':'')+'>'+esc(l)+'</option>';
  const evIds = {}; base.forEach(u=>{ evIds[u.eventId] = u.event || u.eventId; });
  if(f.yev && !evIds[f.yev]) f.yev = '';
  $('#filters').innerHTML =
    (all ? '<select onchange="ST.f.ywho=this.value;render()"><option value="">All employees</option>' + ST.boot.people.map(p=>o(p.id, p.name, f.ywho)).join('') + '</select>' : '') +
    '<select onchange="ST.f.yev=this.value;render()" style="max-width:300px"><option value="">All events</option>' +
      Object.keys(evIds).sort().reverse().map(k=>o(k, evIds[k], f.yev)).join('') + '</select>' +
    '<input placeholder="Search…" value="'+esc(f.yq)+'" oninput="ST.f.yq=this.value;renderMyLuTable()">';
  renderMyLuTable();
}
function renderMyLuTable(){
  const f = ST.f, all = me().canEditUpdates && !mineOnly(), q = f.yq.trim().toLowerCase(), myId = me().id;
  const list = myLuList().filter(u=>{
    if(all && f.ywho && u.doer!==f.ywho) return false;
    if(f.yev && u.eventId!==f.yev) return false;
    if(q && !(u.event+' '+u.doerName+' '+u.text).toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b)=>luRank(a)-luRank(b) || (b.date||0)-(a.date||0) || (b.at||0)-(a.at||0));
  let h = '<div class="small" style="margin-bottom:6px">Change the status here when you start or finish — it updates the <b>Live Updates</b> screen for everyone. Done tasks stay here (grey) for 7 days.</div>' +
    '<div class="tablewrap"><table class="lu"><thead><tr><th class="srn">Sr.</th><th>Date</th><th>Event</th><th>Doer</th><th>Particulars</th><th>Status</th></tr></thead><tbody>';
  if(!list.length) h += '<tr><td colspan="6"><div class="empty">No live update tasks.</div></td></tr>';
  list.forEach((u,i)=>{
    const can = u.doer===myId || me().canEditUpdates;
    const st = can
      ? '<select class="st '+sCls(u.status)+'" onchange="myLuStatus(\''+u.id+'\',this)">'+(ST.boot.updStatuses||[]).map(s=>'<option '+(s===u.status?'selected':'')+'>'+s+'</option>').join('')+'</select>'
      : '<span class="pill '+sCls(u.status)+'">'+esc(u.status)+'</span>';
    h += '<tr class="'+(u.status==='Done'?'lu-done':'')+'"><td class="srn">'+(i+1)+'</td><td class="small" style="white-space:nowrap">'+fmtDay(u.date)+'</td>' +
      '<td>'+luEventCell(u)+'</td><td><b>'+esc(u.doerName)+'</b></td><td class="lu-text">'+esc(u.text)+'</td><td>'+st+'</td></tr>';
  });
  $('#view').innerHTML = h + '</tbody></table></div>';
}
async function myLuStatus(id, el){
  const u = (ST.data.updates||[]).find(x=>x.id===id), val = el.value; el.disabled = true;
  try{ await run('setMyUpdateStatus', AUTH(), id, val); toast('Status → '+val); await load(); }
  catch(e){ el.value = u ? u.status : val; el.disabled = false; }

function luEventCell(u){
  if(u.eventId==='OFF-EVENT') return '<span class="pill">'+esc(u.event||'Off-event work')+'</span>';
  return (ST.data.events||[]).some(e=>e.id===u.eventId)
    ? '<a href="javascript:void 0" class="evlink" onclick="eventModal(\''+u.eventId+'\')" title="Event details">'+esc(u.event||u.eventId)+'</a>'

  const f = ST.f, all = isTaskAdmin();
  // Your Tasks: only admins (owner/PC) see everyone; every other person — including seeAll
  // roles like operations — sees only their own tasks here (the full picture is on the Dashboard/Tracker).
  const mine = myPendingSteps();
  const doers = [...new Set(allPendingSteps().map(p=>p.doer||'(blank)'))].sort();

  const evMap = {};
  mine.forEach(p=>{ evMap[p.ev.id] = p.ev; });
  const evOpts = Object.values(evMap).sort((a,b)=>b.num-a.num);
  $('#filters').innerHTML =
    '<select onchange="ST.f.fstate=this.value;render()">' +
      [['pending','All pending'],['late','Overdue only'],['today','Due today']].map(o=>'<option value="'+o[0]+'" '+(f.fstate===o[0]?'selected':'')+'>'+o[1]+'</option>').join('') + '</select>' +
    (all ? '<select onchange="ST.f.fwho=this.value;render()"><option value="">All employees</option>' +
      doers.map(d=>'<option '+(f.fwho===d?'selected':'')+'>'+esc(d)+'</option>').join('') + '</select>' : '') +
    // "All events" = a box you can type in: e.g. "baj" keeps only Bajaj events; the suggestion list shows matching events
    '<input id="yt_ev" list="yt_evlist" autocomplete="off" style="min-width:300px" placeholder="All events" value="'+esc(f.ytq||'')+'" oninput="ST.f.ytq=this.value;renderFmsList()">' +
    '<datalist id="yt_evlist">' + evOpts.map(e=>'<option value="'+esc(e.company+(evName(e)?' – '+evName(e):'')+' · '+e.id)+'"></option>').join('') + '</datalist>' +
    '<button class="btn ghost sm" onclick="ST.f.ytq=\'\';$(\'#yt_ev\').value=\'\';renderFmsList()">Clear</button>';
  renderFmsList();
}
// Only the task list is redrawn while typing, so the box and its suggestion list stay open
function renderFmsList(){

/* ---------------- Live Updates: shared notepad (Date | Event | Doer | Particulars | Status) ----------------
   Everyone sees it; only UPDATE_EDITORS (Kunal, Ashwini, Jigar by default) can add / edit / delete. */
function istParts(ms){ const d = new Date(ms + 330*60000); return { y:d.getUTCFullYear(), m:d.getUTCMonth(), d:d.getUTCDate(), w:d.getUTCDay() }; }
function istDayStart(ms){ const p = istParts(ms); return Date.UTC(p.y,p.m,p.d) - 330*60000; }
function monthKey(ms){ const p = istParts(ms); return p.y+'-'+String(p.m+1).padStart(2,'0'); }
function monthLabel(k){ const [y,m] = k.split('-'); return new Date(Date.UTC(+y,+m-1,1)).toLocaleDateString('en-GB',{month:'short',year:'numeric',timeZone:'UTC'}); }
function isoDay(ms){ const p = istParts(ms); return p.y+'-'+String(p.m+1).padStart(2,'0')+'-'+String(p.d).padStart(2,'0'); }
function fmtDay(ms){ return ms ? new Date(ms).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric',timeZone:'Asia/Kolkata'}) : '—'; }
function luEvents(){ return (ST.data.events||[]).slice().sort((a,b)=>b.num-a.num); }
function luEvLabel(e){ return e.id+' · '+e.company+(evName(e)?' – '+evName(e):''); }
// Date filter: Today / This week / This month / any month that has rows / All
function luInRange(u){
  const w = ST.f.lwhen, n = now(), t0 = istDayStart(n), d = u.vdate != null ? u.vdate : u.date;   // vdate = day it is shown on (carry forward)
  if(!d) return w==='all';
  if(w==='all') return true;
  if(w==='today') return d >= t0 && d < t0 + 86400000;
  if(w==='week'){ const back = (istParts(n).w + 6) % 7; return d >= t0 - back*86400000 && d < t0 + 86400000*(7-back); }   // Mon–Sun
  if(w==='month') return monthKey(d) === monthKey(n);
  return monthKey(d) === w;
}
/* Carry forward: an In Progress / Pending task also shows on every next day until its planned date (TAT),
   with "↻ from 23 Nov · day 3 of 5". A task Done on a later day shows on the day it was Done.
   Nothing is copied in the sheet: it is the same row, so status / edit / Planned / Actual stay as they are. */
function luPlanned(u){
  if(u.at == null || u.tat === '' || u.tat == null) return null;
  if(u.tatUnit === 'Hours') return u.at + Number(u.tat)*3600000;
  return istDayStart(u.at) + (Number(u.tat)+1)*86400000 - 60000;        // that many days later, 23:59 (like the sheet)
}
function luCarryList(){
  const DAY = 86400000, today = istDayStart(now()), out = [];
  (ST.data.updates||[]).forEach(u=>{
    out.push(Object.assign({}, u, { vdate: u.date }));
    if(!u.date) return;
    const origin = istDayStart(u.date), pl = luPlanned(u);
    const last = pl ? istDayStart(pl) : origin, total = Math.max(1, Math.round((last-origin)/DAY) + 1);
    const tag = d => ({ fromMs: u.date, n: Math.round((d-origin)/DAY) + 1, total, dueMs: pl });
    if(u.status==='In Progress' || u.status==='Pending'){
      for(let d = origin + DAY; d <= Math.min(last, today); d += DAY) out.push(Object.assign({}, u, { vdate: d, carry: tag(d) }));
    } else if(u.status==='Done' && u.doneAt){
      const dd = istDayStart(u.doneAt);
      if(dd > origin && dd <= today) out.push(Object.assign({}, u, { vdate: dd, carry: tag(dd) }));
    }
  });
  return out;
}
function carryLabel(u){
  if(!u.carry) return '';
  const c = u.carry;
  return '<span class="carry" title="Carried forward from '+fmtShort(c.fromMs)+' until it is Done or its due date">↻ from '+fmtShort(c.fromMs)+(c.dueMs ? ' · due '+fmtShort(c.dueMs) : '')+'</span>';
}
// Row order on Live Updates + PMS Tasks: In Progress → Pending → On Hold → Done (latest date first inside each)
function luRank(u){ const r = {'In Progress':0, 'Pending':1, 'On Hold':2, 'Done':3}[u.status]; return r==null ? 2 : r; }

  const f = ST.f, all = ST.data.updates || [], ed = me().canEditUpdates;
  const months = [...new Set(all.filter(u=>u.date).map(u=>monthKey(u.date)))].sort().reverse().filter(k=>k!==monthKey(now()));

      Object.keys(evIds).filter(k=>k!==off.id).sort().reverse().map(k=>o(k, evIds[k], f.lev)).join('') + '</select>' +
    '<select onchange="ST.f.lst=this.value;renderLive()"><option value="">All status</option>' + (ST.boot.updStatuses||[]).map(s=>o(s, s, f.lst)).join('') + '</select>' +

/* ---------------- Event Calendar: events on their Event Date (Confirmed = green, Ongoing = light blue, On Hold = grey) ----------------
   Same events as the Dashboard (Confirmed + Ongoing). Nothing about FMS steps or doers is shown here. */
ST.cal = ST.cal || { y:null, m:null, view:'month', f:'all', q:'' };
const CAL_PH = { c:'Confirmed', o:'Ongoing enquiry', h:'On hold' };
function calPh(e){ return isConf(e) ? 'c' : (e.hold ? 'h' : 'o'); }
function calIso(e){
  const m = String(e.eventDate||'').trim().match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);      // DD/MM/YYYY
  if(!m) return '';
  const d = +m[1], mo = +m[2], y = +m[3];
  if(mo<1 || mo>12 || d<1 || d>31) return '';
  return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');
}
function calEvents(){
  const c = ST.cal, q = c.q.trim().toLowerCase();
  const base = scopeMine() ? ST.data.events.filter(isMineEvent) : ST.data.events;
  return base.filter(e=>isConf(e) || isOngoing(e)).filter(e=>{
    const ph = calPh(e);
    if(c.f==='c' && ph!=='c') return false;
    if(c.f==='o' && ph==='c') return false;
    if(q && !(e.id+' '+e.company+' '+evName(e)+' '+e.client).toLowerCase().includes(q)) return false;
    return true;
  });
}
function calOnDay(list, iso){ return list.filter(e=>calIso(e)===iso).sort((a,b)=>'cho'.indexOf(calPh(a))-'cho'.indexOf(calPh(b)) || a.num-b.num); }
function renderCal(){
  const c = ST.cal, t = isoDay(now());
  if(c.y==null){ c.y = +t.slice(0,4); c.m = +t.slice(5,7)-1; }

function calMonthHtml(list){

/* ---------------- Today snapshot: whole day on one screen + PNG download ----------------
   Cards per doer (DOER_ORDER), one short line per update. Text shrinks until everything fits the screen. */
const SNAP_ICON = { 'Done':'✓', 'In Progress':'●', 'Pending':'○', 'On Hold':'‖' };
function snapOpen(){
  let el = $('#snap');
  if(!el){ el = document.createElement('div'); el.id = 'snap'; document.body.appendChild(el); }
  ST.snapDay = ST.snapDay || isoDay(now());
  el.innerHTML = '<div class="snap-bar"><b>Today snapshot</b>' +
    '<input type="date" id="snap_day" value="'+ST.snapDay+'" onchange="ST.snapDay=this.value;snapRender()">' +
    '<span class="small muted" id="snap_who"></span><span style="flex:1"></span>' +
    '<button class="btn" id="snap_png" onclick="snapPng()">Download image</button>' +
    '<button class="btn ghost" onclick="snapClose()">Close</button></div>' +
    '<div id="snap_wrap"><div id="snapArea"></div></div>';
  el.style.display = 'flex';
  snapRender();
  window.addEventListener('resize', snapFit);
}
function snapClose(){ const el = $('#snap'); if(el) el.style.display = 'none'; window.removeEventListener('resize', snapFit); }
function snapRender(){
  const day = ST.snapDay, who = ST.f.lwho;
  const list = luCarryList().filter(u=>u.vdate && isoDay(u.vdate)===day && (!who || u.doer===who));
  const by = {};
  list.forEach(u=>{ (by[u.doer] = by[u.doer] || { name:u.doerName, items:[] }).items.push(u); });
  const doers = Object.keys(by).sort((a,b)=>doerRank(by[a].name)-doerRank(by[b].name) || String(by[a].name).localeCompare(String(by[b].name)));
  const p = day.split('-'), label = new Date(Date.UTC(+p[0],+p[1]-1,+p[2])).toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric',timeZone:'UTC'});
  const cnt = s => list.filter(u=>u.status===s).length;
  $('#snap_who').textContent = who ? 'Filtered: ' + ((ST.boot.people.find(p=>p.id===who)||{}).name||'') : '';
  $('#snapArea').innerHTML =
    '<div class="sn-head"><div><div class="sn-title">CRES · Live Updates</div><div class="sn-date">'+esc(label)+'</div></div>' +
      '<div class="sn-sum">'+list.length+' updates · '+doers.length+' people<br>' +
      '<span class="sn-st done">✓ '+cnt('Done')+' Done</span> <span class="sn-st">● '+cnt('In Progress')+' In Progress</span> <span class="sn-st">○ '+cnt('Pending')+' Pending</span> <span class="sn-st">‖ '+cnt('On Hold')+' On Hold</span></div></div>' +
    (doers.length ? '<div class="sn-grid">' + doers.map(id=>{
      const g = by[id], items = g.items.slice().sort((a,b)=>luRank(a)-luRank(b) || (a.at||0)-(b.at||0));
      return '<div class="sn-card"><div class="sn-who">'+esc(g.name)+'<span>'+items.length+'</span></div>' +
        items.map(u=>'<div class="sn-it'+(u.status==='Done'?' done':'')+'"><span class="sn-ic" title="'+esc(u.status)+'">'+(SNAP_ICON[u.status]||'○')+'</span>' +
          '<div><div class="sn-ev">'+esc(u.eventId==='OFF-EVENT' ? 'Off-event work' : (u.event||u.eventId))+'</div><div class="sn-tx">'+esc(u.text)+(u.carry?' <span class="sn-carry">↻ '+fmtShort(u.carry.fromMs)+(u.carry.dueMs?' → due '+fmtShort(u.carry.dueMs):'')+'</span>':'')+'</div></div></div>').join('') + '</div>';
    }).join('') + '</div>' : '<div class="empty">No live updates on this day.</div>');
  snapFit();
}
// Largest text size (15px → 8px) at which the whole snapshot fits the screen without scrolling
function snapFit(){
  const wrap = $('#snap_wrap'), area = $('#snapArea'); if(!wrap || !area) return;
  let fs = 15; area.style.fontSize = fs + 'px';
  while(fs > 8 && wrap.scrollHeight > wrap.clientHeight){ fs -= 0.5; area.style.fontSize = fs + 'px'; }
}
function snapLib(){
  if(window.html2canvas) return Promise.resolve();
  return new Promise((res, rej)=>{
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    sc.onload = res; sc.onerror = () => rej(new Error('Could not load the image tool — check the internet connection'));
    document.head.appendChild(sc);
  });
}
async function snapPng(){
  const b = $('#snap_png'); b.disabled = true; b.textContent = 'Preparing…';
  try{
    await snapLib();
    const canvas = await window.html2canvas($('#snapArea'), { scale: 2, backgroundColor: '#ffffff' });
    const a = document.createElement('a');
    a.download = 'CRES-live-updates-' + ST.snapDay + '.png';
    a.href = canvas.toDataURL('image/png');
    document.body.appendChild(a); a.click(); a.remove();
    toast('Image downloaded');
  }catch(e){ toast((e && e.message) || 'Could not make the image', 'err'); }
  finally{ b.disabled = false; b.textContent = 'Download image'; }
}

// Doer order for Live Updates (Config → DOER_ORDER); names not listed come after, A–Z
function doerRank(name){ const o = (ST.boot.doerOrder||[]).map(nameN); const i = o.indexOf(nameN(name)); return i < 0 ? 999 : i; }
function luPeople(){ return ST.boot.people.slice().sort((a,b)=>doerRank(a.name)-doerRank(b.name) || a.name.localeCompare(b.name)); }
// Grouped like the PMS sheet: Date (once) → Doer (once) → one line per event
function renderLiveTable(){
  const f = ST.f, q = f.lq.trim().toLowerCase(), ed = me().canEditUpdates, myId = me().id;
  const dk = u => u.vdate ? isoDay(u.vdate) : '';
  const list = luCarryList().filter(u=>{
    if(!luInRange(u)) return false;
    if(mineOnly() && u.doer!==myId) return false;
    if(f.lwho && u.doer!==f.lwho) return false;
    if(f.lev && u.eventId!==f.lev) return false;
    if(f.lst && u.status!==f.lst) return false;
    if(q && !(u.event+' '+u.doerName+' '+u.text).toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b)=> dk(b).localeCompare(dk(a)) || doerRank(a.doerName)-doerRank(b.doerName) ||
                 String(a.doerName).localeCompare(String(b.doerName)) || luRank(a)-luRank(b) || (a.at||0)-(b.at||0));
  const cols = ed ? 6 : 5;
  let h = '<div class="tablewrap"><table class="lu lug"><thead><tr><th>Date</th><th>Doer</th><th>Event</th><th>Particulars</th><th>Status</th>'+(ed?'<th></th>':'')+'</tr></thead><tbody>';
  if(!list.length) h += '<tr><td colspan="'+cols+'"><div class="empty">No updates for this filter.'+(ed?' Use “+ Add update” to write one.':'')+'</div></td></tr>';
  const nDate = {}, nDoer = {};
  list.forEach(u=>{ nDate[dk(u)] = (nDate[dk(u)]||0)+1; const k = dk(u)+'|'+u.doer; nDoer[k] = (nDoer[k]||0)+1; });
  let lastD = null, lastK = null;
  list.forEach(u=>{
    const d = dk(u), k = d+'|'+u.doer, newD = d!==lastD, newK = k!==lastK;
    const st = ed
      ? '<select class="st '+sCls(u.status)+'" onchange="luStatus(\''+u.id+'\',this)">'+(ST.boot.updStatuses||[]).map(s=>'<option '+(s===u.status?'selected':'')+'>'+s+'</option>').join('')+'</select>'
      : '<span class="pill '+sCls(u.status)+'">'+esc(u.status)+'</span>';
    h += '<tr class="'+(newD?'g-date ':'')+(newK?'g-doer ':'')+(u.status==='Done'?'lu-done':'')+'">';
    if(newD) h += '<td class="g-dt" rowspan="'+nDate[d]+'">'+fmtDay(u.vdate)+'</td>';
    if(newK) h += '<td class="g-who" rowspan="'+nDoer[k]+'"><b>'+esc(u.doerName)+'</b><div class="small muted">'+nDoer[k]+' event'+(nDoer[k]>1?'s':'')+'</div></td>';
    h += '<td>'+luEventCell(u)+'</td>' +
      '<td class="lu-text">'+esc(u.text)+carryLabel(u)+'<div class="small muted" title="Last updated">'+esc(u.updByName||u.byName)+' · '+fmt(u.updAt||u.at)+'</div></td>' +
      '<td>'+st+'</td>'+(ed?'<td><button class="btn ghost sm" onclick="luModal(\''+u.id+'\')">Edit</button></td>':'')+'</tr>';
    lastD = d; lastK = k;
  });
  $('#view').innerHTML = h + '</tbody></table></div>';
}
// Event box you can type in ("baj" → Bajaj). Choices = Off-event work + every event on the dashboard (Confirmed + Ongoing)
function luEvChoices(){
  const off = ST.boot.offEvent || {id:'OFF-EVENT', label:'Off-event work'};
  const evs = luEvents();
  return [{id:off.id, label:off.label}]
    .concat(evs.filter(isConf).map(e=>({id:e.id, label:luEvLabel(e)+' (Confirmed)'})))
    .concat(evs.filter(isOngoing).map(e=>({id:e.id, label:luEvLabel(e)})));
}
function luEvDatalist(){ return '<datalist id="lu_evlist">'+luEvChoices().map(c=>'<option value="'+esc(c.label)+'"></option>').join('')+'</datalist>'; }
function luEvLabelFor(id, fallback){ const c = luEvChoices().find(x=>x.id===id); return c ? c.label : (fallback || id || ''); }
// typed text → Event ID: exact label / exact ID / the only label that contains the text
function luResolveEv(text){
  const t = String(text||'').trim().toLowerCase(); if(!t) return '';
  const ch = luEvChoices();
  const hit = ch.find(c=>c.label.toLowerCase()===t) || ch.find(c=>c.id.toLowerCase()===t);
  if(hit) return hit.id;
  const part = ch.filter(c=>c.label.toLowerCase().includes(t));
  return part.length===1 ? part[0].id : '';
}

function luTatOk(tat, unit){ const tv = Number(tat); return tat!=='' && (unit==='Hours' ? tv>0 : (tv>=0 && Math.floor(tv)===tv)); }
async function luSave(id){
  const date = $('#lu_date').value, doer = $('#lu_doer').value;
  if(!date) return toast('Choose a date', 'err');
  if(!doer) return toast('Choose the doer', 'err');
  if(id){
    const u = (ST.data.updates||[]).find(x=>x.id===id) || {};
    const typed = $('#lu_ev').value;
    const evId = typed === luEvLabelFor(u.eventId, u.event) ? u.eventId : luResolveEv(typed);
    const d = { date, eventId:evId, doer, text:$('#lu_text').value, status:$('#lu_st').value, tat:$('#lu_tat').value, tatUnit:$('#lu_unit').value };
    if(!d.eventId) return toast('Choose an event from the list (or Off-event work)', 'err');
    if(!d.text.trim()) return toast('Write the particulars', 'err');
    if(!luTatOk(d.tat, d.tatUnit)) return toast(d.tatUnit==='Hours' ? 'TAT in hours must be more than 0' : 'TAT in days must be a whole number (0 = today)', 'err');
    const b = $('#lu_go'); b.disabled = true;
    try{ await run('editUpdate', AUTH(), id, d); closeModal(); toast('Update saved'); await load(); }catch(e){ b.disabled = false; }
    return;
  }
  const lines = [...document.querySelectorAll('#lu_lines .lu-line')].map(l=>({
    eventId: luResolveEv(l.querySelector('.l_ev').value), typed: l.querySelector('.l_ev').value.trim(),
    text: l.querySelector('.l_text').value, tat: l.querySelector('.l_tat').value,
    tatUnit: l.querySelector('.l_unit').value, status: l.querySelector('.l_st').value }));
  for(let i=0;i<lines.length;i++){
    const x = lines[i], n = 'Event '+(i+1)+': ';
    if(!x.eventId) return toast(n+(x.typed ? '"'+x.typed+'" is not in the list — pick one from the suggestions' : 'choose an event (or Off-event work)'), 'err');
    if(!x.text.trim()) return toast(n+'write the particulars', 'err');
    if(!luTatOk(x.tat, x.tatUnit)) return toast(n+(x.tatUnit==='Hours' ? 'TAT in hours must be more than 0' : 'TAT in days must be a whole number (0 = today)'), 'err');
  }
  const b = $('#lu_go'); b.disabled = true;
  try{
    await run('addUpdates', AUTH(), date, doer, lines.map(x=>({ eventId:x.eventId, text:x.text, tat:x.tat, tatUnit:x.tatUnit, status:x.status })));
    closeModal(); toast(lines.length+' update'+(lines.length>1?'s':'')+' added'); await load();
  }catch(e){ b.disabled = false; }
}
async function luStatus(id, el){
  const u = (ST.data.updates||[]).find(x=>x.id===id), val = el.value; el.disabled = true;
  try{ await run('editUpdate', AUTH(), id, { statusOnly:true, status:val }); toast('Status → '+val); await load(); }
  catch(e){ el.value = u ? u.status : val; el.disabled = false; }
}
async function luDelete(id){
  if(!confirm('Delete this update? This cannot be undone.')) return;
  try{ await run('deleteUpdate', AUTH(), id); closeModal(); toast('Update deleted'); await load(); }catch(e){}
}

/* ---------------- modals ---------------- */
function openModal(html, wide){ $('#modalBox').className = 'box' + (wide?' wide':''); $('#modalBox').innerHTML = html; $('#modal').classList.remove('hidden'); }
function closeModal(){ $('#modal').classList.add('hidden'); }

/* ---------------- popups: task done (to allocator) / enquiry allocated (to allocatee) ---------------- */
/* ---------------- Notifications: red count on the bell + a list (no popups) ---------------- */
function handleNotifs(list){
  ST.notifs = list || [];
  const n = ST.notifs.filter(x=>!x.seen).length;
  $('#bellc').innerHTML = n ? '<span class="badge">'+(n>99?'99+':n)+'</span>' : '';
  if(ST.notifOpen) renderNotifList();
}
function closePop(){ $('#pop').classList.add('hidden'); }      // kept for older callers
function notifEvId(x){ const m = String((x.taskId||'')+' '+(x.msg||'')).match(/EVT-\d+/i); return m ? m[0].toUpperCase() : ''; }
function reopenNotifs(){
  ST.notifOpen = true;
  openModal('<div class="nf-head"><h3 style="margin:0">Notifications</h3><span style="flex:1"></span>' +
    '<button class="btn ghost sm" id="nf_all" onclick="markAllNotifs()">Mark all as seen</button></div><div id="nf_list"></div>' +
    '<div class="actions"><button class="btn ghost" onclick="ST.notifOpen=false;closeModal()">Close</button></div>');
  renderNotifList();
}
function renderNotifList(){
  const el = $('#nf_list'); if(!el){ ST.notifOpen = false; return; }
  const list = ST.notifs || [], unseen = list.filter(x=>!x.seen).length;
  const b = $('#nf_all'); if(b) b.disabled = !unseen;
  el.innerHTML = !list.length ? '<div class="empty">No notifications yet.</div>' :
    '<div class="small muted" style="margin:6px 0">'+unseen+' new</div>' +
    list.map(x=>'<div class="nf'+(x.seen?'':' new')+'" onclick="openNotif(\''+esc(x.id)+'\')">' +
      '<div class="nf-msg">'+esc(x.msg)+'</div><div class="small muted">'+fmt(x.at)+(notifEvId(x)&&ST.data.events.some(e=>e.id===notifEvId(x))?' · tap to open the event':'')+'</div></div>').join('');
}
async function openNotif(id){
  const x = (ST.notifs||[]).find(n=>n.id===id); if(!x) return;
  if(!x.seen){ x.seen = true; handleNotifs(ST.notifs); try{ await run('markSeen', AUTH(), id); }catch(e){ x.seen = false; handleNotifs(ST.notifs); } }
  const ev = notifEvId(x);
  if(ev && ST.data.events.some(e=>e.id===ev)){ ST.notifOpen = false; eventModal(ev); }
}
async function markAllNotifs(){
  const b = $('#nf_all'); if(b) b.disabled = true;
  try{ await run('markAllSeen', AUTH()); (ST.notifs||[]).forEach(x=>{ x.seen = true; }); handleNotifs(ST.notifs); toast('All notifications marked as seen'); }
  catch(e){ if(b) b.disabled = false; }
}

/* ---------------- PIN login (people without a @creativerays.in account) ---------------- */
function showLogin(msg, prefill, info){
  clearInterval(ST.pollT); clearInterval(ST.tickT);
  $('#tabs').innerHTML = ''; $('#cards').innerHTML = ''; $('#filters').innerHTML = ''; $('#errors').innerHTML = '';
  $('#who').textContent = ''; $('#viewas').innerHTML = ''; $('#testtag').innerHTML = '';
  $('#view').innerHTML =
    '<div class="panel" style="max-width:380px;margin:40px auto"><h4 style="background:var(--brand)">Sign in<small>CRES Task Dashboard</small></h4>' +
    '<div style="padding:16px" class="box" id="loginBox">' +
      '<div class="small">Use the email registered with CRES and the PIN given to you.</div>' +
      '<label>Email</label><input id="l_em" type="email" autocomplete="username" value="'+esc(prefill||'')+'">' +
      '<label>PIN</label><input id="l_pin" type="password" inputmode="numeric" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')doLogin()">' +
      (info?'<div style="margin-top:10px;padding:8px;border-radius:6px;background:#e8f1fb;color:#1d5fa8;font-size:13px">'+esc(info)+'</div>':'') +
      (msg?'<div class="late" style="margin-top:8px">'+esc(msg)+'</div>':'') +
      '<div class="actions"><button class="btn" id="l_go" onclick="doLogin()">Sign in</button></div>' +
      '<div class="small" style="margin-top:10px">Forgot your PIN? Ask the MIS team to reset it.</div>' +
    '</div></div>';
  setTimeout(()=>{ const x = $(prefill ? '#l_pin' : '#l_em'); if(x) x.focus(); }, 50);
}
async function doLogin(){
  const em = $('#l_em').value, pin = $('#l_pin').value;
  if(!em || !pin){ toast('Enter email and PIN', 'err'); return; }
  $('#l_go').disabled = true;
  try{
    TOKEN = await run('pinLogin', em, pin);
    ST.loginEmail = em.trim();
    try{ sessionStorage.setItem('cresTok', TOKEN); sessionStorage.setItem('cresEm', ST.loginEmail); }catch(e){}
    ST.viewAs = ST.pendingViewAs || null;      // admin "View as" target (ignored for everyone else)
    ST.pendingViewAs = null;
    init();
  }catch(e){ const b = $('#l_go'); if(b) b.disabled = false; }
}
async function logout(){
  try{ await run('pinLogout', TOKEN); }catch(e){}
  TOKEN = ''; try{ sessionStorage.removeItem('cresTok'); }catch(e){}
  ST.data = null; ST.boot = null; showLogin();
}

function toggleView(){
  const on = !document.body.classList.contains('mobile');
  document.body.classList.toggle('mobile', on);
  $('#viewbtn').textContent = on ? 'Desktop view' : 'Mobile view';
  try{ localStorage.setItem('cresView', on ? 'mobile' : 'desktop'); }catch(e){}
}
try{ if(localStorage.getItem('cresView')==='mobile') toggleView(); }catch(e){}

init();
if('serviceWorker' in navigator){ window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
